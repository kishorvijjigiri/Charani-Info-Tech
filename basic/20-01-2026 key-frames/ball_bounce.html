<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            width: 100%;
            height: 550px;
            border: 5px groove black;
        }
       
        .shadow{
            position: absolute;
            background-color: rgba(0,0,0,0.5);
            border-radius: 50%;
            filter: blur(4px);
            animation: shrink 5s infinite;
        }
         .box{
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: red;
            animation: bounce 5s infinite;
        }
        @keyframes shrink {
            0%{
                 width: 110px;
            height: 20px;
                top:0px; 
                left: 45%;
                transform: scale(1);
                opacity: 0.5;
            }
            25% {
                 width: 20px;
            height: 110px;
                top: 40%;
                left: 100%;
                transform: scale(0.7);
                opacity: 0.3;
            }
            50% {
                width: 110px;
            height: 20px;
                top: 100%;
                left: 45%; 
                transform: scale(1);
                opacity: 0.5;
            }
             75% {
                width: 20px;
            height: 110px;
                 top: 40%;
                left: 0%; 
                transform: scale(0.7);
                opacity: 0.3;
            }
            100% {
                width: 110px;
            height: 20px;
                top:0px; 
                left: 45%;
                transform: scale(1);
                opacity: 0.5;
            }
        }
         @keyframes bounce {
            0%{
                top: 0%; 
                left: 45%;
               background: radial-gradient(circle at 30% 30%, #ffffff, #eb1010 50%, #540b0b 100%);

            }
            25% {
                top: 40%;
                left: 91.5%; 
                background: radial-gradient(circle at 30% 30%, #ffffff, #402085 50%, #1a0243 100%);
            }
            50% {
                top: 83%;
                left: 45%; 
               background: radial-gradient(circle at 30% 30%, #ffffff, #daf10a 50%, #515705 100%);
            }
             75% {
                top: 40%;
                left: 0%; 
                background: radial-gradient(circle at 30% 30%, #ffffff, #09f40d 50%, #09360c 100%);
            
            }
            100% {
                top: 0%; 
                left: 45%;
                background: radial-gradient(circle at 30% 30%, #ffffff, #eb1010 50%, #540b0b 100%);
            }
        }
    </style>
</head>
<body>
    <div class="container">
    
    <div class="shadow"></div>
    <div class="box"></div>
    </div>
</body>
</html>
