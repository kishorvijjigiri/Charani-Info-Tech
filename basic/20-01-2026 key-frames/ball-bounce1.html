<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            width: 100%;
            height: 550px;
            border: 5px groove black;
        }
       
        .shadow{
            position: absolute;
            background-color: rgba(0,0,0,0.5);
            border-radius: 50%;
            filter: blur(4px);
            animation: shrink 5s infinite;
        }
         .box{
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffffff, #402085 50%, #1a0243 100%);
            animation: bounce 5s infinite;
        }
        @keyframes shrink {
            0%{
                 width: 110px;
            height: 20px;
                top:0px; 
                left: 45%;
                transform: scale(1);
                opacity: 0.5;
            }
            25% {
                 width: 20px;
            height: 110px;
                top: 40%;
                left: 100%;
                transform: scale(0.7);
                opacity: 0.3;
            }
            50% {
                width: 110px;
            height: 20px;
                top: 100%;
                left: 45%; 
                transform: scale(1);
                opacity: 0.5;
            }
             75% {
                width: 20px;
            height: 110px;
                 top: 40%;
                left: 0%; 
                transform: scale(0.7);
                opacity: 0.3;
            }
            100% {
                width: 110px;
            height: 20px;
                top:0px; 
                left: 45%;
                transform: scale(1);
                opacity: 0.5;
            }
        }
         @keyframes bounce {
            0%{
                top: 0%; 
                left: 0%;
              background: radial-gradient(circle at 30% 30%, #ffffff, #402085 50%, #1a0243 100%);
                
            }
            10%{
                top: 91%; 
                left: 20%;
              background: radial-gradient(circle at 30% 30%, #ffffff, #402085 50%, #1a0243 100%);
                
            }
            20%{
                top: 0%; 
                left: 50%;
              background: radial-gradient(circle at 30% 30%, #ffffff, #402085 50%, #1a0243 100%);
                
            }
            30% {
                top: 91%;
                left: 80%; 
                background: radial-gradient(circle at 30% 30%, #ffffff, #402085 50%, #1a0243 100%);
            }
            50% {
                top:0%;
                left: 91%; 
               background: radial-gradient(circle at 30% 30%, #ffffff, #402085 50%, #1a0243 100%);
            }
             70% {
                 top: 91%;
                left: 70%; 
background: radial-gradient(circle at 30% 30%, #ffffff, #402085 50%, #1a0243 100%);
            
            }
            80% {
               top: 0%; 
                left: 50%;
               background: radial-gradient(circle at 30% 30%, #ffffff, #402085 50%, #1a0243 100%);
            }
            90% {
               top: 91%; 
                left: 25%;
               background: radial-gradient(circle at 30% 30%, #ffffff, #402085 50%, #1a0243 100%);
            }
            100% {
               top: 0%; 
                left: 0%;
               background: radial-gradient(circle at 30% 30%, #ffffff, #402085 50%, #1a0243 100%);
            }
        }
    </style>
</head>
<body>
    <div class="container">
    
   <!-- // <div class="shadow"></div> -->
    <div class="box"></div>
    </div>
</body>
</html>
