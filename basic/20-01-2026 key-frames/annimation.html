<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            width: 400px;
            height: 400px;
            border: 1px solid black;
        }
        .box{
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: red;
            animation: next 4s infinite;
        }
         @keyframes next {
            0% {
                background-color: red; top:0%; left: 0%; transform: rotate(0deg);
            }
            25% {background-color: yellow; top:0%; left: 100%; transform: rotate(90deg); }
            50% {background-color: blue; top:100%; left: 100%; transform: rotate(180deg); }
            75% {background-color: green; top:100%; left: 0%; transform: rotate(270deg); }
            100% {background-color: red; top:0%; left: 0%; transform: rotate(360deg);}
        }
    </style>
</head>
<body class="container">
    <div class="box">

    </div>
</body>
</html>
