<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flexcss{
            /* display: inline-grid; */
            display: grid;

            grid-template-columns: auto auto ;
            gap: 10px;
            padding: 10px;
            /* grid-template-rows: 0px 0px 0px 0px ; */
            grid-template-rows: 100px 200px 300px 400px 500px;
            border: 1px solid black;
            /* justify-content: space-evenly; */
            justify-content: space-between;
            align-items: center;
            height: 200px;
        }
        .item1, .item2, .item3, .item4, .item5, .item6, .item7, .item8, .item9, .item10{
            background-color: rgb(81, 0, 255);
            padding: 20px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    
    <div class="flexcss">
        <div class="item1">item1</div>
        <div class="item2">item2</div>
        <div class="item3">item3</div>
        <div class="item4">item4</div>
        <div class="item5">item5</div>
        <div class="item6">item6</div>
        <div class="item7">item7</div>
        <div class="item8">item8</div>
        <div class="item9">item9</div>
        <div class="item10">item10</div>     
    </div>
</body>
</html>
