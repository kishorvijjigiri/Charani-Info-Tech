<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
        position: relative;
        width: 50%;
    }   
    .container img {
        width: 100%;
        height: auto;
    }
    .topleft {
        position: absolute;
        top: 8px;
        left: 16px;
        color: white;
        background-color: black;
        padding: 5px;
    }
    .topright {
        position: absolute;
        top: 8px;
        right: 16px;
        color: white;
        background-color: black;
        padding: 5px;
    }
    .bottomleft {
        position: absolute;
        bottom: 8px;
        left: 16px;
        color: white;
        background-color: black;
        padding: 5px;
    }
    .bottomright {
        position: absolute;
        bottom: 8px;
        right: 16px;
        color: white;
        background-color: black;
        padding: 5px;
    }
    .centered {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        background-color: black;
        padding: 5px;
    }
    </style>
</head>
<body>
    <div class="container">
        <img src="../assets/Abhishek.jpg" alt="Abhishek" />
        <div class="topleft">Top-left</div>
        <div class="topright">Top-right</div>
        <div class="bottomleft">Bottom-left</div>
        <div class="bottomright">Bottom-right</div>
        <div class="centered">Centered</div>
    </div>
</body>
</html>
