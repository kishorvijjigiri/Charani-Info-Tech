        .gallery {
  display: flex;
    overflow-x: auto;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  grid-gap: 15px;
  padding: 15px;
  scroll-snap-type: x mandatory; 
  scrollbar-width: none;
  border: 1px solid black;
}

.gallery-item img {
  width: 100%;
  height: 200px;
  object-fit: cover; /* Keeps aspect ratio while filling the box */
  border-radius: 8px;
  transition: transform 0.3s ease
}
.imgtext {
    display: block;
    text-align: center;
    margin-top: 8px;
    font-size: 16px;
    color: #333;
}

/* Add a hover effect for a professional feel */
.gallery-item img:hover {
  transform: scale(1.1);
}
