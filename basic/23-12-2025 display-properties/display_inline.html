<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispaly Inline</title>
    <style>
        .inner{
            border: 1px solid rgb(245, 243, 243);
            padding: 10px;
            margin: 10px;
            color: white;
        }
        .outer{
            padding: 30px;
            background-color: blue;
        }
        .outer .inner{
            display: inline;
            justify-content: space-evenly;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">Home</div>
        <div class="inner">About</div>
        <div class="inner">Blog</div>
    </div>
</body>
</html>
