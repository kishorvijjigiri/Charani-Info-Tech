<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping Selector</title>
    <style>
        h1,h5{
            background-color: cadetblue;
            color: aliceblue;
            padding: 20px;
            border: 1px;
            margin: 30px;
        }
        *{
            background-color: black;
        }
        h2,h3,h4{
            color: aliceblue;
        }
    </style>
</head>
<body>
    <div>
        <h1>This is grouping Selector example</h1>
        <h2>This is second line</h2>
        <h3>This is second line</h3>
        <h4>This is second line</h4>
        <h5>This is second line</h5>
    </div>
    
</body>
</html>
