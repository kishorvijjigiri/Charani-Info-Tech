    <script>
        var student = {
    firstName: 'Abhi',
    lastName: 'Krishna',

    getFullName: function () {
        return this.firstName + " " + this.lastName;
    },

    age: 21,
    marks: [30, 40, 50, 60, 70],

    getTotalMarks: function () {
        return this.marks.reduce((sum, mark) => sum + mark, 0);
    },

    getResult: function () {
        var avg = this.getTotalMarks() / this.marks.length;
        return avg >= 35 ? "Pass" : "Fail";
    }
};

console.log(student);
console.log(student.getFullName());
console.log("Total Marks:", student.getTotalMarks());
console.log("Result:", student.getResult());

    </script>
