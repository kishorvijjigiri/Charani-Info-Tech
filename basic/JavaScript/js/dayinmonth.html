    <script>
        let year = 2016;
let month = 3; // Feb

let days;

if (month === 2) {
  if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
    days = 29;
  } else {
    days = 28;
  }
} else if ([4,6,9,11].includes(month)) {
  days = 30;
} else {
  days = 31;
}
