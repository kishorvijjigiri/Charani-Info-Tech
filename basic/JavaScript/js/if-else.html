<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>hi hello</h4>
    <script>
        // control statements: if...else, switch, while, do...while, for, for...in, for...of

// if...else
let age = 20;

console.log("if statement example:");
if (age >= 18) {
    console.log("You are an adult.");
}

// if...else statement
console.log("if else statement example:");
if (age >= 18) {
    console.log("You are an adult.");
} else {
    console.log("You are a minor.");
}

// switch statement
let day = 3;

console.log("switch statement example:");  
switch (day) {
    case 1:
        console.log("Monday");
        break;
    case 2:
        console.log("Tuesday");
        break;
    case 3:
        console.log("Wednesday");
        break;
    case 4:
        console.log("Thursday");
        break;
    case 5:
        console.log("Friday");
        break;
    case 6:
        console.log("Saturday");
        break;
    case 7:
        console.log("Sunday");
        break;
    default:
        console.log("Invalid day number.");
}
    </script>
</body>
</html>
