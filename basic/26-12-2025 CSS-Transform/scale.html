<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1,h2,h3,h4,h5{
            border: 1px solid gray;
            background-color: blue;
            color: white;
            padding: 100px;
            width: 100px;
        }
        h1:hover{
            transform: scale(1.1);
        }
        h2:hover{
            transform: scaleX(1.2);
        }
        h3:hover{
            transform: scaleY(1.2);
        }
        h4:hover{
            transform: scaleZ(1.2);
        }
        h5:hover{
            transform: scale3d(1.2,1.2,1.2);
        }
       
    </style>
</head>
<body>
    <div>
        <h1>scale</h1>
    </div>
    <div>
        <h2>scale</h2>
    </div>
    <div>
        <h3>scale</h3>
    </div>
    <div>
        <h4>scale</h4>
    </div>
    <div>
        <h5>scale</h5>
    </div>
</body>
</html>
