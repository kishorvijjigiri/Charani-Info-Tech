<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1,h2,h3,h4,h5{
            border: 1px solid gray;
            background-color: blue;
            color: white;
            padding: 100px;
            width: 100px;
        }
        h1:hover{
            transform: rotate(90deg);
        }
        h2:hover{
            transform: rotateX(90deg);
        }
        
        h3:hover{
            transform: rotateY(90deg)
        }
        h4:hover{
            transform: rotateZ(90deg)
        }
        h5:hover{
            transform: rotate3d(1,1,1,90deg)
        }
       
    </style>
</head>
<body>
    <div>
        <h1>Rotate</h1>
    </div>
    <div>
        <h2>Rotate</h2>
    </div>
    <div>
        <h3>rotate</h3>
    </div>
    <div>
        <h4>rotate</h4>
    </div>
    <div>
        <h5>rotate</h5>
    </div>
    
</body>
</html>
