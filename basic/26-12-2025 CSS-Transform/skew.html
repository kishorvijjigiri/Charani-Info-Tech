<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1,h2,h3,h4{
            border: 1px solid gray;
            background-color: blue;
            color: white;
            padding: 100px;
            width: 100px;
        }
        h1:hover{
            transform: skew(10deg, 10deg);
        }
        h2:hover{
            transform: skewX(10deg);
        }
        h3:hover{
            transform: skewY(10deg);
        }
       
       
    </style>
</head>
<body>
    <div>
        <h1>skew</h1>
    </div>
    <div>
        <h2>skew</h2>
    </div>
    <div>
        <h3>skew</h3>
    </div>
    
</body>
</html>
