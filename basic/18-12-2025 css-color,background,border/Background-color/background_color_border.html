<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            align-items: center;
            margin: auto;
        }
        .bgc1{
            background-color: rgba(0, 0, 255,1);
            border: 3px dashed black;
            padding: 50px;
            width: 50%;
            color: white;
            margin-left: 25%;
            border-radius: 10px;
            outline: 1px;
        }
        .bgc2{
            background-color: rgba(45, 52, 255,0.5);
            border: 5px solid black;
            padding: 50px;
            width: 50%;
            color: white;
            margin-left: 25%;
        }
        
        .bgc3{
            background-color: rgba(224, 247, 75,1);
            border: 5px dotted black;
            padding: 50px;
            width: 50%;
            color: white;
            margin-left: 25%;
        }
        .bgc4{
            background-color: rgba(109, 111, 181, 1);
            border: 5px hidden black;
            padding: 50px;
            width: 50%;
            color: white;
            margin-left: 25%;
        }
        .bgc5{
            background-color: rgba(255, 157, 45, 0.5);
            border: 5px double black;
            padding: 50px;
            width: 50%;
            color: white;
            margin-left: 25%;
        }
        .bgc6{
            background-color: rgba(8, 246, 123, 1);
            border: 10px ridge rgb(108, 26, 239);
            padding: 50px;
            width: 50%;
            color: white;
            margin-left: 25%;
        }
        .bgc7{
            background-color: rgba(27, 223, 197, 0.5);
            border: 10px inset rgb(175, 116, 116);
            padding: 50px;
            width: 50%;
            color: white;
            margin-left: 25%;
        }
        .bgc8{
            background-color: rgba(246, 5, 81, 1);
            border: 10px outset rgb(105, 24, 227);
            padding: 50px;
            width: 50%;
            color: white;
            margin-left: 25%;
        }
        
    </style>
</head>
<body>
    <h1>This is the css background-color with some border</h1>
    <p class="bgc1">content in border</p>
    <p class="bgc2">content in border</p>
    <p class="bgc3">content in border</p>
    <p class="bgc4">content in border</p>
    <p class="bgc5">content in border</p>
    <p class="bgc6">content in border</p>
    <p class="bgc7">content in border</p>
    <p class="bgc8">content in border</p>
    
</body>
</html>
