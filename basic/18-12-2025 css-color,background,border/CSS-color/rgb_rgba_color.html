<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .rgb{
            color: rgb(15, 255, 120);
        }
        .rgba{
            color: rgba(15, 255, 120, 0.5);
        }
        .rgb1{
            color: rgb(255, 15, 120);
        }
        .rgba1{
            color: rgba( 255,15, 120, 0.5);
        }
        .rgb2{
            color: rgb(15,120, 255);
        }
        .rgba2{
            color: rgba(15, 120, 255, 0.3);
        }
    </style>
</head>
<body>
    <h1 class="rgb">This is for css color using RGB</h1>
    <h1 class="rgba">This is for css color using RGBA</h1>
    <h1 class="rgb1">This is for css color using RGB</h1>
    <h1 class="rgba1">This is for css color using RGBA</h1>
    <h1 class="rgb2">This is for css color using RGB</h1>
    <h1 class="rgba2">This is for css color using RGBA</h1>
</body>
</html>
